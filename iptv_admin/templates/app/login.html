{% extends 'base.html' %}
{% block title %}Login · StreamVault{% endblock %}
{% block public_content %}
<main class="login-page app-login-page">
  <section class="login-card" aria-labelledby="app-login-title">
    <div class="brand justify-content-center mb-4">
      <i class="bi bi-tv"></i> StreamVault
    </div>
    <h1 id="app-login-title">Acesso ao aplicativo</h1>
    <p class="text-secondary">Entre para acessar seu catálogo IPTV autorizado.</p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="username">
        Usuário
        <input class="form-control" id="username" name="username" required autocomplete="username" autofocus>
      </label>
      <label for="password">
        Senha
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-primary w-100 mt-3" type="submit">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
      </button>
    </form>
  </section>
</main>
{% endblock %}
