<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Aplicativo IPTV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-card card-panel">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-play-btn-fill"></i></div>
      <h1 class="h3 mt-3">Acesso ao aplicativo</h1>
      <p class="text-secondary mb-0">Entre com suas credenciais para continuar</p>
    </div>
    {% if error %}<div class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endif %}
    <form method="post" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="username">Usuário</label><input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="password">Senha</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entrar no aplicativo</button>
    </form>
  </main>
</body>
</html>
