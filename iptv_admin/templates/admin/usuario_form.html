{% extends 'base.html' %}{% block title %}{{ 'Editar' if user else 'Novo' }} usuário{% endblock %}{% block content %}<div class="page-heading"><div><h1>{{ 'Editar usuário' if user else 'Novo usuário' }}</h1><p class="text-secondary">Defina credenciais e validade do acesso.</p></div></div><form method="post" class="card-panel form-panel"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label>Nome completo<input class="form-control" name="name" value="{{ user.name if user else '' }}" required></label></div><div class="col-md-6"><label>Usuário<input class="form-control" name="username" value="{{ user.username if user else '' }}" required minlength="3"></label></div><div class="col-md-6"><label>E-mail<input class="form-control" type="email" name="email" value="{{ user.email if user and user.email else '' }}"></label></div><div class="col-md-6"><label>Senha {{ '(deixe vazio para manter)' if user else '' }}<input class="form-control" type="password" name="password" {% if not user %}required minlength="8"{% endif %}></label></div>{% if not user %}<div class="col-md-6"><label>Dias de acesso<input class="form-control" type="number" name="days" value="30" min="0" max="3650" required></label></div>{% endif %}<div class="col-md-6"><label>Limite de dispositivos<input class="form-control" type="number" name="device_limit" value="{{ user.device_limit if user else 1 }}" min="1" max="100"></label></div><div class="col-12"><label>Observações<textarea class="form-control" name="notes" rows="3">{{ user.notes if user else '' }}</textarea></label></div><div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" name="active" {% if not user or user.active %}checked{% endif %}> Usuário ativo</label></div></div><div class="form-actions"><a class="btn btn-outline-light" href="{{ url_for('admin.usuarios') }}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button></div></form>{% endblock %}
